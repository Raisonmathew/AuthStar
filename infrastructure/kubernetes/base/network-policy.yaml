# Kubernetes NetworkPolicy — Zero-trust network segmentation
#
# Default-deny posture with explicit allow rules:
# - backend  ← ingress-nginx (HTTP :3000)
# - backend  → pgbouncer (:5432), redis (:6379), runtime (:50061), DNS, HTTPS (:443)
# - runtime  ← backend (gRPC :50061) only; no egress except DNS
# - frontend ← ingress-nginx (HTTP :80) only; no egress except DNS
# - pgbouncer ← backend; egress to RDS (:5432) and DNS
# - prometheus-scraper ← backend (:3000) for /metrics endpoint
#
# NOTE: The pgbouncer selectors are intentionally separate from the postgres
# selectors. The backend connects to pgbouncer (in-cluster), and pgbouncer
# connects to RDS / managed Postgres (external, port 5432 egress).

---
# Default deny all ingress and egress for the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: idaas-platform
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# Allow backend to receive traffic from ingress controller only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-backend
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000

---
# Allow Prometheus scraper to reach the backend /metrics endpoint.
# The /metrics endpoint is intentionally unauthenticated (protected at the
# network layer by this policy — only the Prometheus pod may reach it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-backend
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 3000

---
# Allow backend egress to pgbouncer, redis, runtime, DNS, and external HTTPS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
  - Egress
  egress:
  # DNS resolution
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # PgBouncer connection pooler (backend never connects directly to Postgres)
  - to:
    - podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - protocol: TCP
      port: 5432
  # Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Runtime gRPC
  - to:
    - podSelector:
        matchLabels:
          app: runtime
    ports:
    - protocol: TCP
      port: 50061
  # External HTTPS (Stripe API, SendGrid, OAuth providers, HIBP)
  # Restricted to port 443 only — no arbitrary outbound
  - ports:
    - protocol: TCP
      port: 443

---
# Allow frontend to receive traffic from ingress controller only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 80

---
# Frontend has no egress (it is a static file server; the browser calls the API directly)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-dns
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# Allow runtime to receive gRPC from backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-runtime
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: runtime
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 50061

---
# Runtime has no egress (WASM execution is fully sandboxed)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-runtime-egress-dns
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: runtime
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# Allow PgBouncer to receive connections from backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-pgbouncer
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 5432

---
# Allow PgBouncer egress to RDS (external) and DNS
# RDS/managed Postgres lives outside the cluster, so we allow outbound :5432
# without a podSelector (no in-cluster Postgres pod to target).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer-egress
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
  - Egress
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 5432

---
# Allow Redis to receive connections from backend only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-redis
  namespace: idaas-platform
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend
    ports:
    - protocol: TCP
      port: 6379
