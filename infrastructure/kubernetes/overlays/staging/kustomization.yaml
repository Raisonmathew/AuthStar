apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: staging-

patches:
  # Scale down for staging
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: runtime
    patch: |
      - op: replace
        path: /spec/replicas
        value: 1

  # Reduce resource limits for staging
  - target:
      kind: Deployment
      name: backend
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 384Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 400m

  # Relax PDB for staging (only 1 backend replica needed)
  - target:
      kind: PodDisruptionBudget
      name: backend-pdb
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 1

  # Staging HPA settings
  - target:
      kind: HorizontalPodAutoscaler
      name: backend-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 5

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - APP_ENV=staging

      # ── Domain configuration ───────────────────────────────────────────────
      # Replace with actual staging domain before deploying.
      - ALLOWED_ORIGINS=https://staging.REPLACE_WITH_STAGING_DOMAIN
      - FRONTEND_URL=https://staging.REPLACE_WITH_STAGING_DOMAIN
      - JWT_ISSUER=https://auth.staging.REPLACE_WITH_STAGING_DOMAIN
      - JWT_AUDIENCE=https://api.staging.REPLACE_WITH_STAGING_DOMAIN
      - PASSKEY_RP_ID=staging.REPLACE_WITH_STAGING_DOMAIN
      - PASSKEY_ORIGIN=https://staging.REPLACE_WITH_STAGING_DOMAIN
      - SENDGRID_FROM_EMAIL=noreply@staging.REPLACE_WITH_STAGING_DOMAIN

      # ── JWT ──────────────────────────────────────────────────────────────
      - JWT_EXPIRATION_SECONDS=900

      # ── Redis (standalone is acceptable for staging) ───────────────────
      - REDIS_MODE=standalone

      # ── DB ─────────────────────────────────────────────────────────────
      - DB_MAX_CONNECTIONS=20
      - DB_MIN_CONNECTIONS=2
