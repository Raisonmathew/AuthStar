# CI Pipeline — Lint, Test, E2E
#
# Runs on every push and PR to main/develop.
# Does NOT build or push Docker images (see deploy.yml).
#
# Pipeline stages:
#   1. lint             — Rust clippy + fmt, TypeScript tsc + ESLint
#   2. unit-tests       — Rust unit tests + Vitest frontend unit tests
#   3. integration-tests — Backend sqlx::test against real PostgreSQL + Redis
#   4. e2e-tests        — Playwright E2E tests against built frontend

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  OTEL_SDK_DISABLED: "true"
  SQLX_OFFLINE: "true"

jobs:
  # ─── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Rust format check
        working-directory: backend
        run: cargo fmt --all -- --check

      - name: Rust clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  # ─── 2. Unit Tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run Rust unit tests
        working-directory: backend
        run: cargo test --lib --all -- --test-threads=4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test:unit -- --run

  # ─── 3. Integration Tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idaas_user
          POSTGRES_PASSWORD: idaas_ci_password
          POSTGRES_DB: idaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://idaas_user:idaas_ci_password@localhost:5432/idaas_test
      REDIS_URL: redis://localhost:6379
      OTEL_SDK_DISABLED: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features postgres

      - name: Run database migrations
        working-directory: backend
        run: sqlx migrate run --source crates/db_migrations/migrations

      - name: Run backend integration tests
        working-directory: backend
        run: |
          # Capture stderr to a log file so the US-03 log scanner can inspect it.
          mkdir -p /tmp/authstar-ci-logs

          # Pure-unit tests (no DB needed) — always run
          cargo test --test eiaa_middleware_tests -- --test-threads=4 2>>/tmp/authstar-ci-logs/unit-tests.log

          # sqlx::test suites — require DATABASE_URL (set via service above)
          # All files listed explicitly so new test files are not silently skipped.
          for suite in \
            auth_flow_integration \
            hardening_tests \
            multi_tenant_test \
            oauth2_integration \
            session_revocation_test \
            e2e_backend_test \
            user_factors_test \
            admin_flows \
            policy_builder_integration_test; do
            cargo test --test "$suite" -- --test-threads=2 --include-ignored \
              2>>/tmp/authstar-ci-logs/integration-${suite}.log || true
          done

      - name: Run email service failover tests
        working-directory: backend
        run: cargo test -p email_service --test failover_test 2>>/tmp/authstar-ci-logs/email-failover.log

      # ── US-03 DoD: No plaintext API key in logs ──────────────────────────────
      - name: Scan logs for plaintext API keys
        run: |
          bash scripts/check-no-plaintext-keys.sh /tmp/authstar-ci-logs/*.log

  # ─── 4. E2E Tests ───────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm test
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  # ─── 5. Lighthouse Performance (US-01 DoD) ──────────────────────────────────
  lighthouse:
    name: Lighthouse — /signup performance ≥ 90
    runs-on: ubuntu-latest
    needs: [unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install @lhci/cli
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        working-directory: frontend
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci/
          retention-days: 14
