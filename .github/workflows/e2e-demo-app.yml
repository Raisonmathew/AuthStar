name: E2E — DemoApp

on:
  push:
    branches: [main, AIAUTHANDAUTHZ]
    paths:
      - 'DemoApp/**'
      - 'sdks/**'
      - 'backend/**'
      - '.github/workflows/e2e-demo-app.yml'
  pull_request:
    branches: [main]
    paths:
      - 'DemoApp/**'
      - 'sdks/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run (leave blank for all)'
        required: false
        default: ''

env:
  # AuthStar service URLs (all services run inside docker network on CI)
  AUTHSTAR_BASE_URL: http://localhost:3000
  DEMO_APP_BASE_URL: http://localhost:4000
  PYTHON_AGENT_SERVICE_URL: http://localhost:8001
  ADMIN_EMAIL: admin@example.com
  # IDAAS_BOOTSTRAP_PASSWORD is stored as a GitHub Actions secret.
  # Set it at: Settings → Secrets and variables → Actions → New repository secret
  NEXT_PUBLIC_IDAAS_BASE_URL: http://localhost:3000
  IDAAS_TENANT_ID: system

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1 — Build backend Docker images (cached by layer hash)
  # ─────────────────────────────────────────────────────────────────────────
  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('backend/Dockerfile', 'backend/Dockerfile.runtime', 'backend/Cargo.lock') }}
          restore-keys: buildx-${{ runner.os }}-

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: authstar/api_server:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.runtime
          push: false
          load: true
          tags: authstar/eiaa_runtime:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2 — E2E tests (split into 3 parallel shards)
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    needs: build-images
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]
    steps:
      - uses: actions/checkout@v4

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: DemoApp/py-agent-service/requirements.txt

      # ── Node ──────────────────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            DemoApp/package-lock.json
            DemoApp/playwright/package-lock.json

      # ── Backend + infra ───────────────────────────────────────────────────
      - name: Start infrastructure (Postgres, Redis)
        run: |
          docker compose -f infrastructure/docker-compose/docker-compose.dev.yml \
            up -d postgres redis
          # Wait for Postgres to be ready
          for i in $(seq 1 30); do
            docker compose -f infrastructure/docker-compose/docker-compose.dev.yml \
              exec -T postgres pg_isready -U idaas && break
            sleep 2
          done

      - name: Load pre-built Docker images
        run: |
          docker load -i /tmp/.buildx-cache/authstar-api_server.tar 2>/dev/null || \
            docker build -t authstar/api_server:ci -f backend/Dockerfile backend/
          docker load -i /tmp/.buildx-cache/authstar-eiaa_runtime.tar 2>/dev/null || \
            docker build -t authstar/eiaa_runtime:ci -f backend/Dockerfile.runtime backend/

      - name: Run database migrations
        working-directory: backend
        run: cargo run --bin migrate
        env:
          DATABASE_URL: postgresql://idaas:idaas@localhost:5432/idaas

      - name: Start AuthStar backend
        run: |
          docker run -d --name api_server \
            --network host \
            -e DATABASE_URL=postgresql://idaas:idaas@localhost:5432/idaas \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=ci-jwt-secret-32-chars-minimum-pad \
            -e EIAA_RUNTIME_ADDR=http://localhost:50061 \
            -e TEST_SEED_TOKEN=${{ secrets.TEST_SEED_TOKEN }} \
            -e BOOTSTRAP_ADMIN_EMAIL=${{ env.ADMIN_EMAIL }} \
            -e BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.IDAAS_BOOTSTRAP_PASSWORD }} \
            authstar/api_server:ci
          # Wait for backend health
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && break
            sleep 2
          done

      - name: Start EIAA runtime
        run: |
          docker run -d --name eiaa_runtime \
            --network host \
            authstar/eiaa_runtime:ci
          sleep 3

      # ── DemoApp ───────────────────────────────────────────────────────────
      - name: Install DemoApp dependencies
        working-directory: DemoApp
        run: npm ci

      - name: Build DemoApp
        working-directory: DemoApp
        run: npm run build
        env:
          NEXT_PUBLIC_IDAAS_BASE_URL: ${{ env.NEXT_PUBLIC_IDAAS_BASE_URL }}
          IDAAS_TENANT_ID: ${{ env.IDAAS_TENANT_ID }}

      - name: Start DemoApp
        working-directory: DemoApp
        run: |
          npm start &
          for i in $(seq 1 20); do
            curl -sf http://localhost:4000/ && break
            sleep 2
          done

      # ── Python sidecar ────────────────────────────────────────────────────
      - name: Install Python sidecar
        working-directory: DemoApp/py-agent-service
        run: |
          pip install -r requirements.txt
          pip install ../../sdks/python

      - name: Start Python sidecar
        working-directory: DemoApp/py-agent-service
        run: |
          uvicorn main:app --port 8001 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8001/health && break
            sleep 2
          done
        env:
          AUTHSTAR_BASE_URL: ${{ env.AUTHSTAR_BASE_URL }}
          AUTHSTAR_TENANT_ID: ${{ env.IDAAS_TENANT_ID }}

      # ── Playwright ────────────────────────────────────────────────────────
      - name: Install Playwright dependencies
        working-directory: DemoApp/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        working-directory: DemoApp/playwright
        run: |
          SUITES="${{ github.event.inputs.suite }}"
          if [ -n "$SUITES" ]; then
            npx playwright test "specs/$SUITES" \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=html,github
          else
            npx playwright test \
              --shard=${{ matrix.shard }}/${{ matrix.total }} \
              --reporter=html,github
          fi
        env:
          AUTHSTAR_BASE_URL: ${{ env.AUTHSTAR_BASE_URL }}
          DEMO_APP_BASE_URL: ${{ env.DEMO_APP_BASE_URL }}
          PYTHON_AGENT_SERVICE_URL: ${{ env.PYTHON_AGENT_SERVICE_URL }}
          ADMIN_EMAIL: ${{ env.ADMIN_EMAIL }}
          IDAAS_BOOTSTRAP_PASSWORD: ${{ secrets.IDAAS_BOOTSTRAP_PASSWORD }}
          TEST_SEED_TOKEN: ${{ secrets.TEST_SEED_TOKEN }}
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: DemoApp/playwright/playwright-report/
          retention-days: 14

      - name: Upload test results (for merge)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: DemoApp/playwright/blob-report/
          retention-days: 1

      # ── Diagnostics on failure ────────────────────────────────────────────
      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== api_server ===" && docker logs api_server 2>&1 | tail -100 || true
          echo "=== eiaa_runtime ===" && docker logs eiaa_runtime 2>&1 | tail -50 || true

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3 — Merge sharded HTML reports into a single report
  # ─────────────────────────────────────────────────────────────────────────
  merge-reports:
    name: Merge Playwright Reports
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Install Playwright (merge only)
        working-directory: DemoApp/playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Merge reports
        working-directory: DemoApp/playwright
        run: |
          npx playwright merge-reports \
            --reporter html \
            ../../all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: DemoApp/playwright/playwright-report/
          retention-days: 30
