[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "authstar"
version = "0.1.0"
description = "Official Python SDK for the AuthStar AI Agent Authorization platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "authstar",
  "authorization",
  "ai-agent",
  "eiaa",
  "policy",
  "agentic",
]
authors = [{ name = "AuthStar Team", email = "sdk@authstar.io" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.24",
  "pydantic>=2.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21",
  "respx>=0.20",
]

[project.scripts]
authstar = "authstar.doctor:main"

[project.urls]
Homepage = "https://authstar.io"
Documentation = "https://docs.authstar.io"
Repository = "https://github.com/authstar/authstar-python"
"Bug Tracker" = "https://github.com/authstar/authstar-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["authstar"]

[tool.hatch.build.targets.sdist]
include = [
  "/authstar",
  "/README.md",
  "/pyproject.toml",
]
